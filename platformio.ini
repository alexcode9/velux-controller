; NodeMCU V3 (ESP-12E). Arduino core 3.1.2 via platform 4.2.1.
; espMqttClient is the maintained ESP8266 MQTT client. Its library manifest
; pulls in ESPAsyncTCP; that dependency is pinned here so it cannot float.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    bertmelis/espMqttClient@1.7.3
    ESP32Async/ESPAsyncTCP@2.0.0
